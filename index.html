.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);

  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {

  max-width: 100%;
  height: auto;

#widget &gt; svg {
  width: 100%;

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {

  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-destructive {

      &lt;div&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;路线&lt;/span&gt;&lt;div id=&quot;rb-detail-route&quot;&gt;兰州 → 甘加 → 扎尕那 → 唐克 → 色达 → 壤塘 → 莲宝叶则 → 果洛 → 贵德 → 坎布拉 → 西宁&lt;/div&gt;&lt;/div&gt;

        &lt;div&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;主要景点&lt;/span&gt;&lt;div id=&quot;rb-detail-sights&quot;&gt;甘加秘境、洛克之路、扎尕那、五明佛学院、莲宝叶则、坎布拉&lt;/div&gt;&lt;/div&gt;

        &lt;div class=&quot;rb-overview-wide&quot;&gt;
          &lt;h4&gt;行程&lt;/h4&gt;
          &lt;p&gt;2026年9月1日10:00抵达兰州中川机场，取车后从甘加秘境进入甘南；经夏河、扎尕那、若尔盖、唐克和马尔康转入色达，再串联壤塘、阿坝、莲宝叶则、久治和玛沁，最后经贵德、坎布拉到西宁还车。全程11天、约2,900–3,200 km，建议9月11日住西宁，9月12日再飞北京。&lt;/p&gt;
        &lt;/div&gt;
        &lt;div class=&quot;rb-overview-grid&quot;&gt;
          &lt;div&gt;
            &lt;h4&gt;主要特点&lt;/h4&gt;
            &lt;ul&gt;
              &lt;li&gt;甘肃—四川—青海三省单向穿越，不走回头路，沿途海拔、温差和景观变化大。&lt;/li&gt;
              &lt;li&gt;兼有甘加、拉卜楞寺、色达和壤巴拉人文，以及扎尕那、黄河九曲、莲宝叶则和坎布拉自然风光。&lt;/li&gt;
              &lt;li&gt;D2洛克之路、D5马尔康至色达、D9久治至玛沁是全程对路况和体力要求最高的三天。&lt;/li&gt;
            &lt;/ul&gt;

          &lt;div&gt;
            &lt;h4&gt;行程期间天气&lt;/h4&gt;
            &lt;ul&gt;
              &lt;li&gt;D1兰州机场晴暖，约14–26℃；抵达夏河后降至约10–18℃。&lt;/li&gt;
              &lt;li&gt;D2–D4扎尕那、唐克至马尔康约8–23℃；扎尕那易有阵雨，9月4日马尔康降雨概率较高。&lt;/li&gt;
              &lt;li&gt;D5–D8色达至久治进入最冷时段，约0–14℃；9月5–7日偏阴雨，9月8日久治有转晴趋势但早晚仍接近0℃。&lt;/li&gt;
              &lt;li&gt;D9–D11尚未进入较可靠的短期预报窗口；准备时按玛沁高原0–15℃、贵德—西宁河谷8–22℃预留衣物余量。&lt;/li&gt;
            &lt;/ul&gt;
            &lt;p class=&quot;text-small text-muted rb-source-note&quot;&gt;天气更新于2026年8月25日；8–15天预报只反映趋势，出发前48小时按当日路线逐点复核。&lt;/p&gt;
          &lt;/div&gt;

            &lt;h4&gt;穿衣指南&lt;/h4&gt;
            &lt;ul&gt;
              &lt;li&gt;采用“速干底层＋抓绒/轻薄羽绒＋防风防水外壳”的分层穿法，车内可随时增减。&lt;/li&gt;
              &lt;li&gt;色达、莲宝叶则、久治和玛沁需带薄羽绒、帽子、手套、防水鞋及备用干袜。&lt;/li&gt;
              &lt;li&gt;兰州、贵德中午可能偏热，仍需长袖防晒、遮阳帽、太阳镜和防晒霜；高原阴天也不应忽略紫外线。&lt;/li&gt;
            &lt;/ul&gt;
          &lt;/div&gt;
          &lt;div&gt;
            &lt;h4&gt;注意事项&lt;/h4&gt;
            &lt;ul&gt;
              &lt;li&gt;前几天避免剧烈运动、酒精和过度疲劳；出现高反症状时不要继续上升住宿，若休息后加重应下撤并尽快求助。&lt;/li&gt;
              &lt;li&gt;雨后留意落石、塌方、积水和低能见度；不赶夜路，不因为导航显示更短就进入非铺装捷径。&lt;/li&gt;
              &lt;li&gt;每到县城补油，油量尽量保持在半箱以上；下载离线地图，随车确认备胎、千斤顶、拖车绳和紧急联络方式。&lt;/li&gt;
            &lt;/ul&gt;
          &lt;/div&gt;
          &lt;div class=&quot;rb-overview-wide&quot;&gt;
            &lt;h4&gt;需要特别关注&lt;/h4&gt;
            &lt;ul&gt;
              &lt;li&gt;D2出发前核实洛克之路的降雨、施工和管制；D5核实马尔康—翁达—色达道路，预留至少2小时机动。&lt;/li&gt;
              &lt;li&gt;D6提前确认五明佛学院预约与官方交通；D7棒托寺仅作可选短停，不按导航改走S453青海界捷径；D8和D11分别复核莲宝叶则、坎布拉开放方式。&lt;/li&gt;
              &lt;li&gt;D9为350–400 km高原长距离转场，早出发并在久治、达日及时补给；租车时书面确认跨省、西宁异地还车、救援范围和车损条款。&lt;/li&gt;
              &lt;li&gt;如出现静息呼吸困难、走路不稳或意识异常，应视为高原急症警讯，立即停止上升、寻求医疗并在安全条件下下撤。参考 &lt;a href=&quot;https://www.cdc.gov/yellow-book/hcp/environmental-hazards-risks/high-altitude-travel-and-altitude-illness.html&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;CDC高海拔出行指南&lt;/a&gt;。&lt;/li&gt;
            &lt;/ul&gt;
          &lt;/div&gt;

      .attr(&quot;class&quot;, &quot;rb-province&quot;)
      .attr(&quot;d&quot;, geoPath);
    base.selectAll(&quot;path.rb-prefecture&quot;)
      .data(regionPrefectures.features)
      .join(&quot;path&quot;)
      .attr(&quot;class&quot;, &quot;rb-prefecture&quot;)
      .attr(&quot;d&quot;, geoPath);

    const provinceLabels = [
      { name: &quot;甘肃&quot;, coord: [103.55, 35.80] },
      { name: &quot;青海&quot;, coord: [99.75, 35.45] },
      { name: &quot;四川&quot;, coord: [102.05, 31.72] }
    ];
    base.selectAll(&quot;text.rb-province-label&quot;)
      .data(provinceLabels)
      .join(&quot;text&quot;)
      .attr(&quot;class&quot;, &quot;rb-province-label text-small&quot;)
      .attr(&quot;x&quot;, d =&gt; projection(d.coord)[0])
      .attr(&quot;y&quot;, d =&gt; projection(d.coord)[1])
      .attr(&quot;text-anchor&quot;, &quot;middle&quot;)
      .text(d =&gt; d.name);

    const routes = svg.append(&quot;g&quot;).attr(&quot;class&quot;, &quot;rb-layer&quot;);
    days.forEach((day, index) =&gt; {
      const geometry = { type: &quot;LineString&quot;, coordinates: day.ids.map(id =&gt; points[id].coord) };
      routes.append(&quot;path&quot;)
        .attr(&quot;class&quot;, `rb-route-halo rb-day-mark rb-day-${day.day}`)
        .attr(&quot;d&quot;, geoPath(geometry));
      const route = routes.append(&quot;path&quot;)
        .attr(&quot;class&quot;, `rb-route rb-day-mark rb-day-${day.day} ${day.routeClass || &quot;&quot;}`)
        .style(&quot;--day-color&quot;, colors[index])
        .attr(&quot;d&quot;, geoPath(geometry));
      route.append(&quot;title&quot;).text(`D${day.day} · ${day.route} · ${day.km}`);

      const midpoint = d3.geoInterpolate(points[day.ids[0]].coord, points[day.ids[day.ids.length - 1]].coord)(0.5);
      const p = projection(midpoint);
      routes.append(&quot;text&quot;)
        .attr(&quot;class&quot;, `rb-day-label text-small rb-day-mark rb-day-${day.day}`)
        .attr(&quot;x&quot;, p[0])
        .attr(&quot;y&quot;, p[1] - 7)
        .attr(&quot;text-anchor&quot;, &quot;middle&quot;)
        .text(`D${day.day}`);
    });

    const pointEntries = Object.entries(points).map(([id, value]) =&gt; ({ id, ...value }));
    const marks = svg.append(&quot;g&quot;).attr(&quot;class&quot;, &quot;rb-layer&quot;);

    const attractionMarks = marks.selectAll(&quot;path.rb-attraction&quot;)
      .data(pointEntries.filter(point =&gt; point.kind === &quot;attraction&quot;))
      .join(&quot;path&quot;)
      .attr(&quot;class&quot;, point =&gt; `rb-attraction rb-day-mark ${dayClasses(point)}`)
      .style(&quot;--day-color&quot;, point =&gt; primaryColor(point))
      .attr(&quot;transform&quot;, point =&gt; {
        const [x, y] = projection(point.coord);
        return `translate(${x},${y})`;
      })
      .attr(&quot;d&quot;, d3.symbol().type(d3.symbolDiamond).size(56));
    attractionMarks.append(&quot;title&quot;).text(point =&gt; `${point.name} · D${point.days.join(&quot;/D&quot;)}`);

    const stayMarks = marks.selectAll(&quot;circle.rb-stay&quot;)
      .data(pointEntries.filter(point =&gt; point.kind === &quot;stay&quot;))
      .join(&quot;circle&quot;)
      .attr(&quot;class&quot;, point =&gt; `rb-stay rb-day-mark ${dayClasses(point)}`)
      .style(&quot;--day-color&quot;, point =&gt; primaryColor(point))
      .attr(&quot;cx&quot;, point =&gt; projection(point.coord)[0])
      .attr(&quot;cy&quot;, point =&gt; projection(point.coord)[1])
      .attr(&quot;r&quot;, point =&gt; point.id === &quot;lanzhou&quot; || point.id === &quot;xining&quot; ? 7 : 5.5);
    stayMarks.append(&quot;title&quot;).text(point =&gt; point.name);

    const viaMarks = marks.selectAll(&quot;rect.rb-via&quot;)
      .data(pointEntries.filter(point =&gt; point.kind === &quot;via&quot;))
      .join(&quot;rect&quot;)
      .attr(&quot;class&quot;, point =&gt; `rb-via rb-day-mark ${dayClasses(point)}`)
      .style(&quot;--day-color&quot;, point =&gt; primaryColor(point))
      .attr(&quot;x&quot;, point =&gt; projection(point.coord)[0] - 4)
      .attr(&quot;y&quot;, point =&gt; projection(point.coord)[1] - 4)
      .attr(&quot;width&quot;, 8)
      .attr(&quot;height&quot;, 8);
    viaMarks.append(&quot;title&quot;).text(point =&gt; point.name);

    const compact = width &lt; 520;
    const overviewLabels = new Set([&quot;lanzhou&quot;, &quot;ganjia&quot;, &quot;xiahe&quot;, &quot;zhagana&quot;, &quot;tangke&quot;, &quot;maerkang&quot;, &quot;seda&quot;, &quot;rangtang&quot;, &quot;aba&quot;, &quot;lianbao&quot;, &quot;jiuzhi&quot;, &quot;maqin&quot;, &quot;guide&quot;, &quot;kanbula&quot;, &quot;xining&quot;]);
    const selectedNumber = selectedDay === &quot;all&quot; ? null : Number(selectedDay);
    const labelData = pointEntries.filter(point =&gt; {
      if (selectedNumber !== null) return point.days.includes(selectedNumber);
      if (compact) return overviewLabels.has(point.id) &amp;&amp; point.kind !== &quot;via&quot;;
      return overviewLabels.has(point.id);
    });
    const placeLabel = point =&gt; {
      const [x] = projection(point.coord);
      const baseOffset = labelOffsets[point.id] || [8, -8, &quot;start&quot;];
      if (x &gt; width - 105) return [-8, baseOffset[1], &quot;end&quot;];
      if (x &lt; 82) return [8, baseOffset[1], &quot;start&quot;];
      return baseOffset;
    };

    marks.selectAll(&quot;text.rb-place-label&quot;)
      .data(labelData)
      .join(&quot;text&quot;)
      .attr(&quot;class&quot;, point =&gt; `rb-place-label text-small rb-day-mark ${dayClasses(point)}`)
      .attr(&quot;x&quot;, point =&gt; projection(point.coord)[0] + placeLabel(point)[0])
      .attr(&quot;y&quot;, point =&gt; projection(point.coord)[1] + placeLabel(point)[1])
      .attr(&quot;text-anchor&quot;, point =&gt; placeLabel(point)[2])
      .text(point =&gt; point.name);

    updateFocus();
    loading.hidden = true;
  }

  function updateFocus() {
    const allMarks = svg.selectAll(&quot;.rb-day-mark&quot;);
    allMarks.classed(&quot;is-dim&quot;, false).classed(&quot;is-focus&quot;, false);
    if (selectedDay !== &quot;all&quot;) {
      allMarks.classed(&quot;is-dim&quot;, function() { return !this.classList.contains(`rb-day-${selectedDay}`); });
      svg.selectAll(`.rb-route.rb-day-${selectedDay}`).classed(&quot;is-focus&quot;, true);
    }
  }

  function renderPhotos(keys) {
    const strip = root.querySelector(&quot;#rb-photo-strip&quot;);
    strip.replaceChildren();
    strip.hidden = keys.length === 0;
    keys.forEach(key =&gt; {
      const photo = photos[key];
      if (!photo) return;
      const figure = document.createElement(&quot;figure&quot;);
      figure.className = &quot;rb-photo&quot;;

      const image = document.createElement(&quot;img&quot;);
      image.src = photo.src;
      image.alt = photo.alt;
      image.loading = &quot;lazy&quot;;
      image.decoding = &quot;async&quot;;

      const caption = document.createElement(&quot;figcaption&quot;);
      caption.className = &quot;text-small text-muted&quot;;
      const sourceLink = document.createElement(&quot;a&quot;);
      sourceLink.href = photo.source;
      sourceLink.target = &quot;_blank&quot;;
      sourceLink.rel = &quot;noopener noreferrer&quot;;
      sourceLink.textContent = photo.name;
      const licenseLink = document.createElement(&quot;a&quot;);
      licenseLink.href = photo.licenseUrl;
      licenseLink.target = &quot;_blank&quot;;
      licenseLink.rel = &quot;noopener noreferrer&quot;;
      licenseLink.textContent = photo.license;
      caption.append(sourceLink, ` · ${photo.author} · `, licenseLink);
      figure.append(image, caption);
      strip.append(figure);
    });
  }

  function updateDetail(dayValue) {
    const date = root.querySelector(&quot;#rb-detail-date&quot;);
    const title = root.querySelector(&quot;#rb-detail-title&quot;);
    const stay = root.querySelector(&quot;#rb-detail-stay&quot;);
    const route = root.querySelector(&quot;#rb-detail-route&quot;);
    const drive = root.querySelector(&quot;#rb-detail-drive&quot;);
    const sights = root.querySelector(&quot;#rb-detail-sights&quot;);
    const note = root.querySelector(&quot;#rb-detail-note&quot;);
    const noteLabel = root.querySelector(&quot;#rb-detail-note-label&quot;);
    const overview = root.querySelector(&quot;#rb-overview&quot;);
    if (dayValue === &quot;all&quot;) {
      date.textContent = &quot;9月1日—9月11日&quot;;
      title.textContent = &quot;全程概览&quot;;
      stay.textContent = &quot;9月11日住西宁&quot;;
      route.textContent = &quot;兰州 → 甘加 → 扎尕那 → 唐克 → 色达 → 壤塘 → 莲宝叶则 → 果洛 → 贵德 → 坎布拉 → 西宁&quot;;
      drive.textContent = &quot;约2,900–3,200 km · 11天&quot;;
      sights.textContent = &quot;甘加秘境、洛克之路、扎尕那、五明佛学院、莲宝叶则、坎布拉&quot;;
      note.textContent = &quot;D2、D5、D9为重点驾驶日；高原雨天不赶夜路，所有施工和景区开放状态在出发前48小时复核。&quot;;
      noteLabel.textContent = &quot;全程提醒&quot;;
      overview.hidden = false;
      renderPhotos([&quot;zhagana&quot;, &quot;larung&quot;, &quot;kanbula&quot;]);
      return;
    }
    const day = days[Number(dayValue) - 1];
    date.textContent = day.date;
    title.textContent = `D${day.day}`;
    stay.textContent = day.stay;
    route.textContent = day.route;
    drive.textContent = `${day.km} · ${day.drive}`;
    sights.textContent = day.sights;
    note.textContent = day.note;
    noteLabel.textContent = &quot;当天要点&quot;;
    overview.hidden = true;
    renderPhotos(day.photos || []);
  }

  buttons.forEach(button =&gt; {
    button.addEventListener(&quot;click&quot;, () =&gt; {
      selectedDay = button.dataset.day;
      buttons.forEach(item =&gt; {
        const active = item === button;
        item.setAttribute(&quot;aria-pressed&quot;, String(active));
        item.classList.toggle(&quot;btn-primary&quot;, active);
        item.classList.toggle(&quot;btn-ghost&quot;, !active);
      });
      draw();
      updateDetail(selectedDay);
    });
  });

  const observer = new ResizeObserver(() =&gt; draw());
  observer.observe(mapWrap);
  draw();
  updateDetail(&quot;all&quot;);
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;

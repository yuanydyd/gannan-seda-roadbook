  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {

}

    &lt;button type=&quot;button&quot; class=&quot;btn btn-ghost&quot; data-day=&quot;6&quot; aria-pressed=&quot;false&quot;&gt;&lt;span class=&quot;rb-swatch rb-c6&quot;&gt;&lt;/span&gt;D6&lt;/button&gt;
    &lt;button type=&quot;button&quot; class=&quot;btn btn-ghost&quot; data-day=&quot;7&quot; aria-pressed=&quot;false&quot;&gt;&lt;span class=&quot;rb-swatch rb-c1&quot;&gt;&lt;/span&gt;D7&lt;/button&gt;
    &lt;button type=&quot;button&quot; class=&quot;btn btn-ghost&quot; data-day=&quot;8&quot; aria-pressed=&quot;false&quot;&gt;&lt;span class=&quot;rb-swatch rb-c2&quot;&gt;&lt;/span&gt;D8&lt;/button&gt;
    &lt;button type=&quot;button&quot; class=&quot;btn btn-ghost&quot; data-day=&quot;9&quot; aria-pressed=&quot;false&quot;&gt;&lt;span class=&quot;rb-swatch rb-c3&quot;&gt;&lt;/span&gt;D9&lt;/button&gt;
    &lt;button type=&quot;button&quot; class=&quot;btn btn-ghost&quot; data-day=&quot;10&quot; aria-pressed=&quot;false&quot;&gt;&lt;span class=&quot;rb-swatch rb-c4&quot;&gt;&lt;/span&gt;D10&lt;/button&gt;
    &lt;button type=&quot;button&quot; class=&quot;btn btn-ghost&quot; data-day=&quot;11&quot; aria-pressed=&quot;false&quot;&gt;&lt;span class=&quot;rb-swatch rb-c5&quot;&gt;&lt;/span&gt;D11&lt;/button&gt;
  &lt;/div&gt;

  &lt;div class=&quot;rb-map-wrap&quot;&gt;
    &lt;svg role=&quot;img&quot; aria-labelledby=&quot;rb-map-title rb-map-desc&quot;&gt;
      &lt;title id=&quot;rb-map-title&quot;&gt;兰州至西宁十一日自驾路线地图&lt;/title&gt;
      &lt;desc id=&quot;rb-map-desc&quot;&gt;主路线从兰州中川机场出发，经过甘加、夏河、洛克之路、扎尕那、唐克、阿坝、莲宝叶则、久治、班玛、达日、甘德和玛沁，再经贵德、坎布拉到达西宁；玛多和阿尼玛卿以虚线标为备选支线。&lt;/desc&gt;

    &lt;div class=&quot;rb-loading text-small text-muted&quot; aria-live=&quot;polite&quot;&gt;正在绘制地图…&lt;/div&gt;
  &lt;/div&gt;

  &lt;div class=&quot;rb-key text-small&quot; aria-label=&quot;地图图例&quot;&gt;
    &lt;span&gt;&lt;span class=&quot;rb-key-dot&quot;&gt;&lt;/span&gt;住宿 / 当日终点&lt;/span&gt;
    &lt;span&gt;&lt;span class=&quot;rb-key-diamond&quot;&gt;◆&lt;/span&gt;主要景点&lt;/span&gt;
    &lt;span&gt;&lt;span class=&quot;rb-key-square&quot;&gt;&lt;/span&gt;途经节点&lt;/span&gt;
    &lt;span&gt;&lt;span class=&quot;rb-key-alt&quot;&gt;&lt;/span&gt;备选支线&lt;/span&gt;
    &lt;span class=&quot;text-muted&quot;&gt;景点级示意，实际道路以导航和临时管制为准 · 底图 cn-atlas · 坐标 OSM/Nominatim&lt;/span&gt;
  &lt;/div&gt;

  &lt;section class=&quot;card rb-detail&quot; aria-live=&quot;polite&quot;&gt;
    &lt;div class=&quot;rb-detail-heading&quot;&gt;
      &lt;div&gt;
        &lt;div class=&quot;text-small text-muted&quot; id=&quot;rb-detail-date&quot;&gt;9月1日—9月11日&lt;/div&gt;
        &lt;h3 id=&quot;rb-detail-title&quot;&gt;全程概览&lt;/h3&gt;
      &lt;/div&gt;
      &lt;span class=&quot;viz-badge&quot; id=&quot;rb-detail-stay&quot;&gt;9月11日住西宁&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;rb-detail-content&quot;&gt;
      &lt;div&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;路线&lt;/span&gt;&lt;div id=&quot;rb-detail-route&quot;&gt;兰州 → 甘加 → 扎尕那 → 唐克 → 阿坝 → 莲宝叶则 → 久治 → 班玛 → 达日 → 甘德 → 玛沁 → 贵德 → 坎布拉 → 西宁&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;rb-meta-row&quot;&gt;
        &lt;div&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;驾驶&lt;/span&gt;&lt;div id=&quot;rb-detail-drive&quot;&gt;主线约2,300–2,600 km · 11天&lt;/div&gt;&lt;/div&gt;
        &lt;div&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;主要景点&lt;/span&gt;&lt;div id=&quot;rb-detail-sights&quot;&gt;甘加秘境、洛克之路、扎尕那、莲宝叶则、班玛、格萨尔文化、坎布拉&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;天气&lt;/span&gt;&lt;div id=&quot;rb-detail-weather&quot;&gt;兰州晴暖；甘南、阿坝和果洛早晚寒冷，D6–D7及D10重点防雨，D11出发前48小时复核。&lt;/div&gt;&lt;/div&gt;
      &lt;div&gt;&lt;span class=&quot;text-small text-muted&quot; id=&quot;rb-detail-note-label&quot;&gt;全程提醒&lt;/span&gt;&lt;div id=&quot;rb-detail-note&quot;&gt;D2、D5、D10为重点驾驶日；D9默认玛沁休整，玛多与阿尼玛卿只作为二选一备选，不进入未开放保护区。&lt;/div&gt;&lt;/div&gt;
      &lt;section id=&quot;rb-overview&quot; class=&quot;rb-overview&quot; aria-label=&quot;整体行程说明&quot;&gt;
        &lt;div class=&quot;rb-overview-wide&quot;&gt;
          &lt;h4&gt;行程&lt;/h4&gt;
          &lt;p&gt;2026年9月1日10:00抵达兰州中川机场，取车后从甘加秘境进入甘南；经夏河、扎尕那、若尔盖和唐克进入阿坝县，游览莲宝叶则后用五晚串联果洛州的久治、班玛、达日、甘德和玛沁，最后经贵德、坎布拉到西宁还车。全程11天，主线约2,300–2,600 km，建议9月11日住西宁，9月12日再飞北京。&lt;/p&gt;
        &lt;/div&gt;
        &lt;div class=&quot;rb-overview-grid&quot;&gt;
          &lt;div&gt;
            &lt;h4&gt;主要特点&lt;/h4&gt;
            &lt;ul&gt;
              &lt;li&gt;甘肃—四川—青海三省单向穿越，不走回头路，沿途海拔、温差和景观变化大。&lt;/li&gt;
              &lt;li&gt;兼有甘加、拉卜楞寺、班玛红色文化和果洛格萨尔文化，以及扎尕那、黄河九曲、莲宝叶则和坎布拉自然风光。&lt;/li&gt;
              &lt;li&gt;取消马尔康—色达—壤塘绕行和五明佛学院预约，把果洛住宿增加到五晚；D4和D9用于适应海拔与休整。&lt;/li&gt;
            &lt;/ul&gt;
            &lt;p class=&quot;text-small text-muted rb-source-note&quot;&gt;果洛点位参考&lt;a href=&quot;https://www.cnr.cn/qhfw/zgqh/20260615/t20260615_527661272.shtml&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;2026年果洛州旅游线路&lt;/a&gt;。&lt;/p&gt;
          &lt;/div&gt;
          &lt;div&gt;
            &lt;h4&gt;行程期间天气&lt;/h4&gt;
            &lt;ul&gt;
              &lt;li&gt;D1兰州晴，约14–29℃；抵达夏河后约4–18℃，当天温差可达20℃以上。&lt;/li&gt;
              &lt;li&gt;D2–D4甘南、若尔盖至阿坝约4–20℃；D3若尔盖上午可能有阵雨，D4阿坝午后有小雨概率。&lt;/li&gt;
              &lt;li&gt;D5–D7阿坝至达日约3–18℃，整体转阴冷；D6久治—班玛预计阵雨转持续雨，D7达日仍可能有小雨。&lt;/li&gt;
              &lt;li&gt;D8–D9甘德、玛沁约2–15℃，D8较晴、D9云量增多；若选玛多，9月8日晚最低约−2℃，9月9日约2–14℃并可能有雨。&lt;/li&gt;
              &lt;li&gt;D10贵德约12–19℃并有雨；D11仍超出较稳定预报窗口，9月9日晚再次复核贵德、坎布拉和西宁。&lt;/li&gt;
            &lt;/ul&gt;
            &lt;p class=&quot;text-small text-muted rb-source-note&quot;&gt;天气更新于2026年8月27日20:00；中长期预报只反映趋势，出发前48小时按当日路线逐点复核。&lt;/p&gt;
          &lt;/div&gt;
          &lt;div&gt;
            &lt;h4&gt;穿衣指南&lt;/h4&gt;
            &lt;ul&gt;
              &lt;li&gt;采用“速干底层＋抓绒/轻薄羽绒＋防风防水外壳”的分层穿法，车内可随时增减。&lt;/li&gt;
              &lt;li&gt;莲宝叶则、久治、达日和玛沁需带薄羽绒、帽子、手套、防水鞋及备用干袜；若走玛多备选线，按夜间低于0℃准备。&lt;/li&gt;
              &lt;li&gt;兰州、贵德中午可能偏热，仍需长袖防晒、遮阳帽、太阳镜和防晒霜；高原阴天也不应忽略紫外线。&lt;/li&gt;
            &lt;/ul&gt;
          &lt;/div&gt;
          &lt;div&gt;
            &lt;h4&gt;注意事项&lt;/h4&gt;
            &lt;ul&gt;
              &lt;li&gt;前几天避免剧烈运动、酒精和过度疲劳；出现高反症状时不要继续上升住宿，若休息后加重应下撤并尽快求助。&lt;/li&gt;
              &lt;li&gt;雨后留意落石、塌方、积水和低能见度；不赶夜路，不因为导航显示更短就进入非铺装捷径。&lt;/li&gt;
              &lt;li&gt;每到县城补油，油量尽量保持在半箱以上；下载离线地图，随车确认备胎、千斤顶、拖车绳和紧急联络方式。&lt;/li&gt;
            &lt;/ul&gt;
            &lt;h4 class=&quot;rb-subheading&quot;&gt;预约与购票清单&lt;/h4&gt;
            &lt;ul&gt;
              &lt;li&gt;建议出发前完成：D2扎尕那。8月30日前通过微信小程序“扎尕那大景区”复核实名购票、分时预约和自驾车管理规则，并保存电子凭证。&lt;/li&gt;
              &lt;li&gt;建议提前1–2天实名购票：D5莲宝叶则在9月3–4日通过微信或支付宝小程序“阿坝旅游”办理；D11坎布拉在9月10日晚通过景区官方公众号或携程、美团购票，同时确认景交车、船班和进入口。&lt;/li&gt;
              &lt;li&gt;果洛主线没有新增常规门票预约；玛多、阿尼玛卿的关键不是购票，而是确认开放范围、交通管控和是否需要报备。未获得当地文旅或交警明确确认时，不进入保护区或非铺装穿越线。&lt;/li&gt;
            &lt;/ul&gt;
          &lt;/div&gt;
          &lt;div class=&quot;rb-overview-wide&quot;&gt;
            &lt;h4&gt;D8–D9备选方案&lt;/h4&gt;
            &lt;ul&gt;
              &lt;li&gt;主线（推荐）：D8达日→甘德→玛沁，D9在玛沁安排永宝山、格萨尔文化与非遗体验，保留休整和天气机动。&lt;/li&gt;
              &lt;li&gt;玛多备选：D8改为达日→花石峡→玛多，D9玛多→花石峡→玛沁；相对主线约增加240–320 km，放弃甘德和玛沁休整，仅走开放公路，不自行进入黄河源核心区、冬格措那湖湿地或三江源未开放区域。&lt;/li&gt;
              &lt;li&gt;阿尼玛卿备选：保留D8主线，D9在当地确认外围公共道路及观景点开放后，从玛沁往返；不穿越、不登山、不驶入冰川或保护区。若天气、开放状态不明，执行玛沁休整主线。&lt;/li&gt;
            &lt;/ul&gt;
          &lt;/div&gt;
          &lt;div class=&quot;rb-overview-wide&quot;&gt;
            &lt;h4&gt;需要特别关注&lt;/h4&gt;
            &lt;ul&gt;
              &lt;li&gt;D2出发前核实洛克之路的降雨、施工和管制；D5复核莲宝叶则开放和久治方向路况，14:00–15:00前离园。&lt;/li&gt;
              &lt;li&gt;D6–D8每到久治、班玛、达日和甘德及时补油；D6–D7目前有连续降雨信号，山区导航时间通常偏乐观，不走无编号近路，不在雨雾中赶夜路。&lt;/li&gt;
              &lt;li&gt;年保玉则、阿尼玛卿雪山、冬格措那湖湿地公园及三江源黄河园区均按未开放核心区域处理，不采纳网络穿越攻略。参考&lt;a href=&quot;https://www.sohu.com/a/1017866348_121106869&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;果洛州文旅部门安全声明&lt;/a&gt;。&lt;/li&gt;

  const alternativeRoutes = [
    { name: &quot;玛多备选（替换D8–D9）&quot;, ids: [&quot;dari&quot;, &quot;madoi&quot;, &quot;maqin&quot;], days: [8, 9] },

  const regionCodes = new Set([&quot;51&quot;, &quot;62&quot;, &quot;63&quot;]);
  const regionProvinces = {

  const routeFrame = {
    type: &quot;Feature&quot;,

  const labelOffsets = {

    ruoergai: [8, -8, &quot;start&quot;], ninebend: [-8, -9, &quot;end&quot;], tangke: [8, 15, &quot;start&quot;],
    wache: [8, -8, &quot;start&quot;], aba: [8, 15, &quot;start&quot;], lianbao: [-8, 15, &quot;end&quot;],

  };

  let selectedDay = &quot;all&quot;;
  let projection;

  function dayClasses(item) {

  function primaryColor(item) {

  function draw() {
    const width = Math.max(320, Math.round(mapWrap.getBoundingClientRect().width));

    svg.selectAll(&quot;g.rb-layer&quot;).remove();

    projection = d3.geoMercator().fitExtent([[18, 18], [width - 18, height - 22]], routeFrame);
    const geoPath = d3.geoPath(projection);
    const base = svg.append(&quot;g&quot;).attr(&quot;class&quot;, &quot;rb-layer&quot;);

    base.selectAll(&quot;path.rb-province&quot;)

    const provinceLabels = [

    base.selectAll(&quot;text.rb-province-label&quot;)

      .join(&quot;text&quot;)
      .attr(&quot;class&quot;, &quot;rb-province-label text-small&quot;)
      .attr(&quot;x&quot;, d =&gt; projection(d.coord)[0])
      .attr(&quot;y&quot;, d =&gt; projection(d.coord)[1])
      .attr(&quot;text-anchor&quot;, &quot;middle&quot;)

    const routes = svg.append(&quot;g&quot;).attr(&quot;class&quot;, &quot;rb-layer&quot;);
    days.forEach((day, index) =&gt; {
      if (day.ids.length &gt; 1) {

        routes.append(&quot;path&quot;)
          .attr(&quot;class&quot;, `rb-route-halo rb-day-mark rb-day-${day.day}`)
          .attr(&quot;d&quot;, geoPath(geometry));
        const route = routes.append(&quot;path&quot;)

          .attr(&quot;d&quot;, geoPath(geometry));

    const pointEntries = Object.entries(points).map(([id, value]) =&gt; ({ id, ...value }));
    const marks = svg.append(&quot;g&quot;).attr(&quot;class&quot;, &quot;rb-layer&quot;);

    const attractionMarks = marks.selectAll(&quot;path.rb-attraction&quot;)

      .join(&quot;path&quot;)

    attractionMarks.append(&quot;title&quot;).text(point =&gt; `${point.name} · D${point.days.join(&quot;/D&quot;)}`);

    const alternativeMarks = marks.selectAll(&quot;path.rb-alt-point&quot;)
      .data(pointEntries.filter(point =&gt; point.kind === &quot;alternative&quot;))

      .attr(&quot;cx&quot;, point =&gt; projection(point.coord)[0])

    const viaMarks = marks.selectAll(&quot;rect.rb-via&quot;)

      .join(&quot;rect&quot;)
      .attr(&quot;class&quot;, point =&gt; `rb-via rb-day-mark ${dayClasses(point)}`)
      .style(&quot;--day-color&quot;, point =&gt; primaryColor(point))
      .attr(&quot;x&quot;, point =&gt; projection(point.coord)[0] - 4)
      .attr(&quot;y&quot;, point =&gt; projection(point.coord)[1] - 4)

    viaMarks.append(&quot;title&quot;).text(point =&gt; point.name);

    const compact = width &lt; 520;

    const selectedNumber = selectedDay === &quot;all&quot; ? null : Number(selectedDay);

      if (x &gt; width - 105) return [-8, baseOffset[1], &quot;end&quot;];
      if (x &lt; 82) return [8, baseOffset[1], &quot;start&quot;];

    marks.selectAll(&quot;text.rb-place-label&quot;)

  function updateFocus() {

  function renderPhotos(keys) {
    const strip = root.querySelector(&quot;#rb-photo-strip&quot;);

    keys.forEach(key =&gt; {
      const photo = photos[key];

      const figure = document.createElement(&quot;figure&quot;);

      const image = document.createElement(&quot;img&quot;);
      image.src = photo.src;
      image.alt = photo.alt;
      image.loading = &quot;lazy&quot;;
      image.decoding = &quot;async&quot;;

      const caption = document.createElement(&quot;figcaption&quot;);

      const sourceLink = document.createElement(&quot;a&quot;);
      sourceLink.href = photo.source;
      sourceLink.target = &quot;_blank&quot;;
      sourceLink.rel = &quot;noopener noreferrer&quot;;
      sourceLink.textContent = photo.name;
      const licenseLink = document.createElement(&quot;a&quot;);
      licenseLink.href = photo.licenseUrl;
      licenseLink.target = &quot;_blank&quot;;
      licenseLink.rel = &quot;noopener noreferrer&quot;;
      licenseLink.textContent = photo.license;

      drive.textContent = &quot;主线约2,300–2,600 km · 11天&quot;;
      sights.textContent = &quot;甘加秘境、洛克之路、扎尕那、莲宝叶则、班玛、格萨尔文化、坎布拉&quot;;
      weather.textContent = &quot;兰州晴暖；甘南、阿坝和果洛早晚寒冷，D6–D7及D10重点防雨，D11出发前48小时复核。&quot;;
      note.textContent = &quot;D2、D5、D10为重点驾驶日；D9默认玛沁休整，玛多与阿尼玛卿只作为二选一备选，不进入未开放保护区。&quot;;
      noteLabel.textContent = &quot;全程提醒&quot;;
      overview.hidden = false;
      renderPhotos([&quot;zhagana&quot;, &quot;kanbula&quot;]);
      return;
    }
    const day = days[Number(dayValue) - 1];
    date.textContent = day.date;
    title.textContent = `D${day.day}`;
    stay.textContent = day.stay;
    route.textContent = day.route;
    drive.textContent = `${day.km} · ${day.drive}`;
    sights.textContent = day.sights;
    weather.textContent = day.weather;
    note.textContent = day.note;
    noteLabel.textContent = &quot;当天要点&quot;;
    overview.hidden = true;
    renderPhotos(day.photos || []);
  }

  buttons.forEach(button =&gt; {
    button.addEventListener(&quot;click&quot;, () =&gt; {
      selectedDay = button.dataset.day;
      buttons.forEach(item =&gt; {
        const active = item === button;
        item.setAttribute(&quot;aria-pressed&quot;, String(active));
        item.classList.toggle(&quot;btn-primary&quot;, active);
        item.classList.toggle(&quot;btn-ghost&quot;, !active);
      });
      draw();
      updateDetail(selectedDay);
    });
  });

  const observer = new ResizeObserver(() =&gt; draw());
  observer.observe(mapWrap);
  draw();
  updateDetail(&quot;all&quot;);
&lt;/script&gt;
